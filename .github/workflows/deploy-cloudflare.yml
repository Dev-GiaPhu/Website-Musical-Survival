name: Deploy Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://musical-survival-official.robloxphu113.workers.dev
      PRODUCTION_URL: https://musical-survival-official.robloxphu113.workers.dev
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_PHONE_VERIFICATION_ENABLED: ${{ secrets.NEXT_PUBLIC_PHONE_VERIFICATION_ENABLED }}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${{ secrets.NEXT_PUBLIC_SUPPORT_EMAIL }}
      MOMO_PARTNER_CODE: ${{ secrets.MOMO_PARTNER_CODE }}
      MOMO_ACCESS_KEY: ${{ secrets.MOMO_ACCESS_KEY }}
      MOMO_SECRET_KEY: ${{ secrets.MOMO_SECRET_KEY }}
      MOMO_ENDPOINT: ${{ secrets.MOMO_ENDPOINT }}
      MOMO_IPN_URL: ${{ secrets.MOMO_IPN_URL }}
      MOMO_REDIRECT_URL: ${{ secrets.MOMO_REDIRECT_URL }}
      GAME_SERVER_API_KEY: ${{ secrets.GAME_SERVER_API_KEY }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}

    steps:
      - name: Protect production branch
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || (echo "Production deploy is restricted to main" && exit 1)

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify required deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "Missing NEXT_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate
        run: |
          npm run typecheck
          npm run lint

      - name: Build Worker
        run: npx opennextjs-cloudflare build

      - name: Prepare Worker secrets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const keys = [
            "NEXT_PUBLIC_SITE_URL",
            "NEXT_PUBLIC_SUPABASE_URL",
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY",
            "SUPABASE_SERVICE_ROLE_KEY",
            "NEXT_PUBLIC_PHONE_VERIFICATION_ENABLED",
            "NEXT_PUBLIC_SUPPORT_EMAIL",
            "MOMO_PARTNER_CODE",
            "MOMO_ACCESS_KEY",
            "MOMO_SECRET_KEY",
            "MOMO_ENDPOINT",
            "MOMO_IPN_URL",
            "MOMO_REDIRECT_URL",
            "GAME_SERVER_API_KEY",
            "BOOTSTRAP_ADMIN_EMAIL"
          ];
          const values = {};
          for (const key of keys) {
            const value = process.env[key];
            if (value) values[key] = value;
          }
          fs.writeFileSync(".deploy-secrets.json", JSON.stringify(values));
          NODE

      - name: Deploy Worker
        run: npx wrangler deploy --secrets-file .deploy-secrets.json

      - name: Smoke test production
        shell: bash
        run: |
          for path in "/" "/auth?mode=login" "/news" "/events" "/store" "/api/health"; do
            echo "Checking $PRODUCTION_URL$path"
            curl --fail --silent --show-error --location               --retry 6 --retry-all-errors --retry-delay 3               --max-time 30               "$PRODUCTION_URL$path" > /dev/null
          done

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .deploy-secrets.json
